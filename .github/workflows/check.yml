name: Check application
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build preview
        run: npm run build
        env:
          CI: ''
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
